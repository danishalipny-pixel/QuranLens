<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#04372a" />
      <stop offset="100%" stop-color="#021f18" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Outer Decorative Ring -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-dasharray="14 10" opacity="0.45" />
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.8" />

  <!-- Center Glow -->
  <circle cx="256" cy="256" r="120" fill="#059669" opacity="0.15" filter="blur(20px)" />

  <!-- Open Quran Book & Rays Emblem -->
  <g filter="url(#shadow)">
    <!-- Lens / Guidance Star Symbol -->
    <path d="M256 120 L262 145 L287 151 L262 157 L256 182 L250 157 L225 151 L250 145 Z" fill="url(#goldGrad)" />
    <circle cx="256" cy="151" r="5" fill="#ffffff" />

    <!-- Open Book Pages (Left & Right) -->
    <!-- Left Page -->
    <path d="M256 340 C210 320 150 325 125 345 C125 240 125 235 125 225 C150 205 210 200 256 220 Z" fill="#fffbeb" />
    <path d="M256 340 C210 320 150 325 125 345" fill="none" stroke="#eab308" stroke-width="4" />
    <!-- Left page lines -->
    <line x1="150" y1="245" x2="235" y2="238" stroke="#ca8a04" stroke-width="3" stroke-linecap="round" opacity="0.5" />
    <line x1="150" y1="270" x2="235" y2="263" stroke="#ca8a04" stroke-width="3" stroke-linecap="round" opacity="0.5" />
    <line x1="150" y1="295" x2="235" y2="288" stroke="#ca8a04" stroke-width="3" stroke-linecap="round" opacity="0.5" />

    <!-- Right Page -->
    <path d="M256 340 C302 320 362 325 387 345 C387 240 387 235 387 225 C362 205 302 200 256 220 Z" fill="#fffbeb" />
    <path d="M256 340 C302 320 362 325 387 345" fill="none" stroke="#eab308" stroke-width="4" />
    <!-- Right page lines -->
    <line x1="277" y1="238" x2="362" y2="245" stroke="#ca8a04" stroke-width="3" stroke-linecap="round" opacity="0.5" />
    <line x1="277" y1="263" x2="362" y2="270" stroke="#ca8a04" stroke-width="3" stroke-linecap="round" opacity="0.5" />
    <line x1="277" y1="288" x2="362" y2="295" stroke="#ca8a04" stroke-width="3" stroke-linecap="round" opacity="0.5" />

    <!-- Book Spine / Rihal Stand -->
    <path d="M256 215 L256 350" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" />
    <path d="M236 346 L216 380 M276 346 L296 380" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Tagline Arabic / Nastaliq script touch -->
  <text x="256" y="425" text-anchor="middle" font-family="'Amiri', serif" font-size="28" font-weight="bold" fill="url(#goldGrad)" letter-spacing="1">
    قرآن لینز
  </text>
  <text x="256" y="455" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#a7f3d0" letter-spacing="3">
    READ • UNDERSTAND • REFLECT
  </text>
</svg>
