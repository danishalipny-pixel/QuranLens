<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#04372a" />
      <stop offset="100%" stop-color="#021f18" />
    </linearGradient>
    <linearGradient id="goldGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <!-- Full Bleed Square for Maskable PWA Icon -->
  <rect width="512" height="512" fill="url(#bgGradMask)" />

  <!-- Safe Zone Circular Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#goldGradMask)" stroke-width="3" opacity="0.6" stroke-dasharray="10 8" />

  <!-- Center Content scaled inside 75% safe area -->
  <g transform="translate(40, 35) scale(0.85)">
    <!-- Lens / Guidance Star Symbol -->
    <path d="M256 120 L262 145 L287 151 L262 157 L256 182 L250 157 L225 151 L250 145 Z" fill="url(#goldGradMask)" />
    <circle cx="256" cy="151" r="5" fill="#ffffff" />

    <!-- Left Page -->
    <path d="M256 340 C210 320 150 325 125 345 C125 240 125 235 125 225 C150 205 210 200 256 220 Z" fill="#fffbeb" />
    <path d="M256 340 C210 320 150 325 125 345" fill="none" stroke="#eab308" stroke-width="4" />
    <line x1="150" y1="245" x2="235" y2="238" stroke="#ca8a04" stroke-width="3" stroke-linecap="round" opacity="0.5" />
    <line x1="150" y1="270" x2="235" y2="263" stroke="#ca8a04" stroke-width="3" stroke-linecap="round" opacity="0.5" />
    <line x1="150" y1="295" x2="235" y2="288" stroke="#ca8a04" stroke-width="3" stroke-linecap="round" opacity="0.5" />

    <!-- Right Page -->
    <path d="M256 340 C302 320 362 325 387 345 C387 240 387 235 387 225 C362 205 302 200 256 220 Z" fill="#fffbeb" />
    <path d="M256 340 C302 320 362 325 387 345" fill="none" stroke="#eab308" stroke-width="4" />
    <line x1="277" y1="238" x2="362" y2="245" stroke="#ca8a04" stroke-width="3" stroke-linecap="round" opacity="0.5" />
    <line x1="277" y1="263" x2="362" y2="270" stroke="#ca8a04" stroke-width="3" stroke-linecap="round" opacity="0.5" />
    <line x1="277" y1="288" x2="362" y2="295" stroke="#ca8a04" stroke-width="3" stroke-linecap="round" opacity="0.5" />

    <!-- Book Spine / Rihal Stand -->
    <path d="M256 215 L256 350" stroke="url(#goldGradMask)" stroke-width="6" stroke-linecap="round" />
    <path d="M236 346 L216 380 M276 346 L296 380" stroke="url(#goldGradMask)" stroke-width="6" stroke-linecap="round" />

    <!-- Label -->
    <text x="256" y="420" text-anchor="middle" font-family="'Amiri', serif" font-size="28" font-weight="bold" fill="url(#goldGradMask)">
      قرآن لینز
    </text>
  </g>
</svg>
